      # MULTIBOT PRIVACY POLICY
      *Last Updated: December 2025*

      ## 1. Introduction
      Your privacy is critically important to us. This Privacy Policy explains how Multibot ("we," "us," or "our") collects, uses, shares, and protects your information when you use our website and services (collectively, the "Services").

      By using the Services, you agree to the collection and use of information in accordance with this policy.

      ## 2. Information We Collect
      ### 2.1 Information You Provide
      - **Account Information:** When you register, we collect your email address, name, and password.
      - **User Content:** We collect and store the text, files, and other input you submit to the Services ("Input") and the content effectively generated by the Services ("Output").
      - **Communications:** We collect information when you contact us for support or other inquiries.

      ### 2.2 Information We Automatically Collect
      - **Usage Data:** We collect data about how you interact with the Services, such as feature usage, timestamps, and error logs.
      - **Device Information:** We collect information about the device and browser you use, including IP address, browser type, and operating system.
      - **Cookies and Similar Technologies:** We use cookies to manage sessions, remember preferences, and analyze usage. You can control cookie preferences through your browser settings.

      ## 3. How We Use Your Information
      We use your information for the following purposes:
      - **To Provide and Maintain the Service:** Ensuring our platform functions correctly and securely.
      - **To Improve the Service:** Analyzing usage patterns to develop new features and enhance user experience.
      - **To Communicate with You:** Sending administrative updates, security alerts, and support responses.
      - **To Enforce Our Terms:** Preventing fraud, abuse, and violations of our Terms of Service.

      **Important:** We do **NOT** use your private non-public User Content (Input or Output) to train our public foundation AI models without your explicit, opt-in consent.

      ## 4. How We Share Your Information
      We do not sell your personal information. We only share information in the following circumstances:
      - **Service Providers:** With trusted third-party vendors who assist in operating our Services (e.g., cloud hosting, payment processing, email delivery), subject to strict confidentiality obligations.
      - **Legal Requirements:** If required by law, subpoena, or valid legal process, or to protect the safety, rights, or property of Multibot, our users, or the public.
      - **Business Transfers:** In connection with a merger, acquisition, or sale of assets, where user information would be transferred as a business asset.

      ## 5. Your Rights and Choices
      ### 5.1 Access and Control
      Depending on your location (including the EU, UK, California, and other jurisdictions), you may have the right to:
      - **Access:** Request a copy of the personal data we hold about you.
      - **Correction:** Request correction of inaccurate data.
      - **Deletion:** Request deletion of your account and personal data.
      - **Portability:** Receive your data in a structured, commonly used format.

      To exercise these rights, please contact us at **contact@myapps.ai**.

      ### 5.2 Opt-Out of Sale/Sharing (California & US States)
      Although we do not sell your personal data, you may have the right to opt-out of the "sharing" of personal data for cross-context behavioral advertising. We honor Global Privacy Control (GPC) signals.

      ## 6. Data Retention
      We retain your personal information only for as long as necessary to provide the Services and fulfill the purposes outlined in this policy, or as required by law. When you delete your account, we delete your data from our active databases, subject to reasonable backup retention periods.

      ## 7. Security
      We implement industry-standard security measures to protect your information from unauthorized access, alteration, disclosure, or destruction. However, no method of transmission over the Internet is 100% secure, and we cannot guarantee absolute security.

      ## 8. International Data Transfers
      If you are accessing the Services from outside the United States, please be aware that your information may be transferred to, stored, and processed in the United States or other countries where our servers are located. We rely on appropriate legal mechanisms, such as Standard Contractual Clauses, for such transfers.

      ## 9. Children's Privacy
      Our Services are not directed to children under 13. We do not knowingly collect personal information from children under 13. If we become aware that we have collected such information, we will take steps to delete it.

      ## 10. Changes to This Policy
      We may update this Privacy Policy from time to time. We will notify you of any material changes by posting the new Privacy Policy on this page and updating the "Last Updated" date.

      ## 11. Contact Us
      If you have any questions about this Privacy Policy, please contact us at:
      **Multibot**
      Email: **contact@myapps.ai**

