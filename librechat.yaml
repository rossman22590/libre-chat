      # MULTIBOT PRIVACY POLICY

      *Last Updated: December 28, 2025*

      ## 1. Introduction

      This Privacy Policy explains how Multibot collects, uses, shares, and protects information when you use our website and services (collectively, the “Services”). By using the Services, you agree to this Privacy Policy.

      ## 2. Information We Collect

      ### 2.1 Information You Provide

      * **Account Information:** Email address, name, and password.
      * **User Content:** Text, files, and other inputs you submit (“Input”) and content generated by the Services (“Output”), including chats.
      * **Communications:** Information you provide when you contact us.

      ### 2.2 Information We Automatically Collect

      * **Usage Data:** Feature usage, timestamps, diagnostics, and error logs.
      * **Device Information:** IP address, browser type, and operating system.
      * **Cookies and Similar Technologies:** Used to manage sessions, remember preferences, and analyze usage. You can control cookies through browser settings.

      ## 3. How We Use Your Information

      We use information to:

      * Provide, maintain, and secure the Services;
      * Improve and develop features;
      * Communicate with you about administrative and security matters;
      * Prevent fraud, abuse, and violations of our Terms.

      **Private Chats and No Training on Your Content**
      Your chats and other private, non-public User Content are private. We do **not** use your private, non-public User Content, including chats, Input, or Output, to train public foundation AI models without your explicit opt-in consent.

      We may use limited service data for operational purposes such as abuse prevention, security, debugging, analytics, and improving product performance and reliability. We do not sell your chats.

      ## 4. How We Share Your Information

      We do not sell personal information. We may share information:

      * With service providers (hosting, payment processing, email delivery) under confidentiality obligations;
      * To comply with law or legal process, or to protect rights, safety, and security;
      * In connection with a merger, acquisition, or sale of assets, where data may transfer as part of the transaction.

      ## 5. Your Rights and Choices

      Depending on your location, you may have rights to access, correct, delete, or receive a copy of your data. To request these, contact: [contact@myapps.ai](mailto:contact@myapps.ai).

      If applicable, you may opt out of “sharing” for cross-context behavioral advertising. We honor Global Privacy Control signals where required.

      ## 6. Data Retention and Deletion

      We retain information as long as necessary to provide the Services and for legitimate business or legal purposes.

      **Account Deletion and Deletion Requests**
      If you delete your account or request deletion of your data, we will delete or de-identify your User Content and associated account data from our active systems and production servers, and we will instruct our service providers that process data on our behalf to do the same. We may retain certain information as required by law, to resolve disputes, enforce agreements, prevent fraud or abuse, or maintain security.

      **Backups**
      Copies of data may remain in encrypted backups for a limited period and will be deleted or overwritten as part of normal backup cycles.

      ## 7. Security

      We use industry-standard security measures, but no method of transmission or storage is completely secure. We cannot guarantee absolute security.

      ## 8. International Data Transfers

      If you access the Services from outside the United States, your information may be transferred to and processed in the United States or other countries. Where required, we rely on appropriate legal mechanisms such as Standard Contractual Clauses.

      ## 9. Children’s Privacy

      The Services are not directed to children under 13, and we do not knowingly collect personal information from children under 13. If we learn we have collected such information, we will delete it.

      ## 10. Changes to This Policy

      We may update this Privacy Policy from time to time by posting the revised policy and updating the “Last Updated” date.

      ## 11. Contact Us

      If you have questions about this Privacy Policy, contact:
      **Multibot**
